[project]
name = "orchestrator"
version = "2.0.0"
description = "GPU scheduler, chat proxy and admin API"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "httpx==0.28.1",
    "redis==8.1.0",
    "docker==7.2.0",
    "nvidia-ml-py==13.615.71",
    "psutil==7.2.2",
    "huggingface_hub==2.4.0",
    "pydantic-settings==2.16.2",
    "python-multipart==0.0.33",
]

[dependency-groups]
dev = [
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "fakeredis==2.40.0",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
pythonpath = ["."]
testpaths = ["tests"]
