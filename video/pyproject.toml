[project]
name = "media"
version = "2.0.0"
description = "Z-Image-Turbo, Wan 2.2 TI2V-5B and OpenCV VIP filters"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.162.0",
    "uvicorn[standard]==0.54.0",
    "anyio>=4.6",
    "torch==2.15.0",
    "diffusers==0.42.1",
    "transformers==5.22.1",
    "accelerate==1.15.0",
    "safetensors>=0.6",
    "sentencepiece>=0.2",
    "ftfy==6.3.1",
    "huggingface_hub==2.4.0",
    "pillow==13.0.0",
    "numpy==2.5.4",
    "imageio==2.38.1",
    "imageio-ffmpeg==0.8.1",
    "opencv-contrib-python-headless==5.0.0.93",
    "scikit-learn==1.9.1",
    "scipy==1.18.1",
]

[tool.uv]
package = false
# torch 2.15 from PyPI ships CUDA 13.2 libraries (needs host driver >= 580)
environments = ["sys_platform == 'linux' and platform_machine == 'x86_64'"]
